services:

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    networks:
      - app-network

  video-stream:
    image: linuxserver/ffmpeg:latest
    container_name: video-stream
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./videos:/videos:ro
      - ./scripts/start-streams.sh:/start-streams.sh:ro
    entrypoint: ["/bin/bash"]
    command: ["/start-streams.sh"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
